services:
  - type: web
    name: studentsguide-classroom
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    autoDeployTrigger: commit
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FAST_MODEL
        value: gemini-3.5-flash-lite
      - key: IP_AI_GENERATION_LIMIT_PER_HOUR
        value: "25"
      - key: DAILY_AI_GENERATION_LIMIT
        value: "100"
      - key: AI_CONCURRENCY_LIMIT
        value: "3"
      - key: AI_CALL_TIMEOUT_SECONDS
        value: "120"
      - key: AI_RESPONSE_CACHE_TTL_SECONDS
        value: "1800"
      - key: AI_RESPONSE_CACHE_MAX_ENTRIES
        value: "12"
      - key: MAX_UPLOAD_MB
        value: "50"
